<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DailyTask Earning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
    }

    .register-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h2>🔐 Login</h2>
    <div class="subtitle">DailyTask Earning</div>

    <input type="email" id="email" placeholder="Email Address">

    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn" onclick="loginUser()">
      Login
    </button>

    <div id="message"></div>

    <div class="register-link">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyBUxAiC17gKvnyVAdZEuQ0IEi3ctzckd_Y",
      authDomain: "dailytask-earning.firebaseapp.com",
      databaseURL: "https://dailytask-earning-default-rtdb.firebaseio.com",
      projectId: "dailytask-earning",
      storageBucket: "dailytask-earning.firebasestorage.app",
      messagingSenderId: "1054491992628",
      appId: "1:1054491992628:web:e5f4820e9a77ef38252061"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    function loginUser() {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const message = document.getElementById("message");
      const button = document.getElementById("loginBtn");


      if (!email || !password) {
        message.style.color = "red";
        message.innerText = "Please enter email and password.";
        return;
      }


      button.disabled = true;
      button.innerText = "Logging in...";


      auth.signInWithEmailAndPassword(email, password)

        .then(() => {

          message.style.color = "green";
          message.innerText = "Login successful!";

          setTimeout(() => {
            window.location.href = "index.html";
          }, 700);

        })

        .catch((error) => {

          button.disabled = false;
          button.innerText = "Login";

          message.style.color = "red";

          if (
            error.code === "auth/user-not-found" ||
            error.code === "auth/invalid-credential"
          ) {
            message.innerText = "Email or password is incorrect.";
          }
          else if (error.code === "auth/invalid-email") {
            message.innerText = "Invalid email address.";
          }
          else {
            message.innerText = error.message;
          }

        });

    }

  </script>

</body>
</html>
