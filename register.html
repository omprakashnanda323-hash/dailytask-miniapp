<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - DailyTask Earning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <h2>📝 Create Account</h2>
    <div class="subtitle">DailyTask Earning</div>

    <input type="text" id="name" placeholder="Full Name">

    <input type="tel" id="mobile" placeholder="Mobile Number">

    <input type="email" id="email" placeholder="Email Address">

    <input type="password" id="password" placeholder="Password">

    <button id="registerBtn" onclick="registerUser()">
      Create Account
    </button>

    <div id="message"></div>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyBUxAiC17gKvnyVAdZEuQ0IEi3ctzckd_Y",
      authDomain: "dailytask-earning.firebaseapp.com",
      databaseURL: "https://dailytask-earning-default-rtdb.firebaseio.com",
      projectId: "dailytask-earning",
      storageBucket: "dailytask-earning.firebasestorage.app",
      messagingSenderId: "1054491992628",
      appId: "1:1054491992628:web:e5f4820e9a77ef38252061"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    // Get referral ID
const urlParams = new URLSearchParams(window.location.search);
const urlRef = urlParams.get("ref");

if (urlRef) {
  localStorage.setItem("pendingReferral", urlRef);
}

    function registerUser() {

      const name = document.getElementById("name").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const message = document.getElementById("message");
      const button = document.getElementById("registerBtn");


      if (!name || !mobile || !email || !password) {
        message.style.color = "red";
        message.innerText = "Please fill all fields.";
        return;
      }

      if (password.length < 6) {
        message.style.color = "red";
        message.innerText = "Password must be at least 6 characters.";
        return;
      }


      button.disabled = true;
      button.innerText = "Creating Account...";

      auth.createUserWithEmailAndPassword(email, password)

        .then(async (userCredential) => {

          const user = userCredential.user;

          await user.updateProfile({
            displayName: name
          });

          await db.ref("users/" + user.uid).set({

            uid: user.uid,
            name: name,
            mobile: mobile,
            email: email,

            count: 0,
            taskBalance: 0,
            completedTasks: 0,
            withdrawnAmount: 0,

            createdAt: Date.now()

          });

// Save referral information
const pendingReferral = localStorage.getItem("pendingReferral");

if (pendingReferral && pendingReferral !== user.uid) {

  await db.ref("referrals/" + user.uid).set({
    referrerId: pendingReferral,
    referredUserId: user.uid,
    status: "pending",
    createdAt: Date.now()
  });

  localStorage.removeItem("pendingReferral");
}

             
          message.style.color = "green";
          message.innerText = "Account created successfully!";

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);

        })

        .catch((error) => {

          button.disabled = false;
          button.innerText = "Create Account";

          message.style.color = "red";

          if (error.code === "auth/email-already-in-use") {
            message.innerText = "This email is already registered.";
          }
          else if (error.code === "auth/invalid-email") {
            message.innerText = "Invalid email address.";
          }
          else if (error.code === "auth/weak-password") {
            message.innerText = "Password is too weak.";
          }
          else {
            message.innerText = error.message;
          }

        });

    }

  </script>

</body>
</html>
